<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2b1748"><link rel="manifest" href="manifest.webmanifest"><title>Religião — Shorts</title><style>*{box-sizing:border-box}body{margin:0;background:#10091b;color:#fff;font:16px system-ui}.app{max-width:560px;margin:auto;height:100vh;background:#211238}.top{position:fixed;z-index:5;top:0;width:min(560px,100%);padding:15px 18px;background:#211238ee;display:flex;justify-content:space-between;border-bottom:1px solid #51366f}.top b{color:#ffd66b}.feed{height:100vh;overflow:auto;scroll-snap-type:y mandatory}.short{min-height:100vh;scroll-snap-align:start;padding:72px 22px 32px;display:flex;flex-direction:column;justify-content:center}.tag{color:#d9a8ff;font-weight:800;margin-bottom:8px}.title{color:#ffd66b;font-size:14px;font-weight:800;margin-bottom:12px}.text{font-family:Georgia,'Times New Roman',serif;font-size:20px;line-height:1.43;white-space:pre-wrap}.box{margin-top:12px;padding:11px 13px;border-radius:14px;background:#321d50;border:1px solid #65458b}.box b{color:#ffd66b}.box div{margin-top:6px;line-height:1.4}.meaning{background:#291943}.source{color:#c9bada;font-size:13px;margin-top:12px;padding-top:9px;border-top:1px solid #51366f}.counter{color:#c9bada;font-size:12px}</style></head><body><div class="app"><div class="top"><b>RELIGIÃO • SHORTS</b><span class="counter" id="count"></span></div><main id="feed" class="feed"></main></div><script src="shorts-data.js?v=6"></script><script src="corpus-200.js?v=2"></script><script src="corpus-refs.js?v=2"></script><script>const S=[...(window.RELIGIAO_SHORTS||[]),...(window.RELIGIAO_CORPUS_200||[])];count.textContent=S.length+' shorts';function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function significado(x){if(x.meaning)return x.meaning;return 'Em português direto e aproximadamente pelo contexto: '+String(x.text||'').replace(/\s*Trecho\/conteúdo conferido na pesquisa\.?/g,'').trim();}feed.innerHTML=S.map(x=>`<article class="short"><div class="tag">${esc(x.category||'Texto')}</div>${x.title?`<div class="title">${esc(x.title)}</div>`:''}<div class="text">${esc(x.text)}</div>${x.translation?`<div class="box"><b>Tradução / termos em português</b><div>${esc(x.translation)}</div></div>`:''}<div class="box meaning"><b>Significado aproximado pelo contexto</b><div>${esc(significado(x))}</div></div>${x.source?`<div class="source">Fonte: ${esc(x.source)}</div>`:''}</article>`).join('');</script></body></html>
