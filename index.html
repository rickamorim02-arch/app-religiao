<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2b1748"><link rel="manifest" href="manifest.webmanifest"><title>Religião — Shorts</title><style>*{box-sizing:border-box}body{margin:0;background:#10091b;color:#fff;font:16px system-ui}.app{max-width:560px;margin:auto;height:100vh;background:#211238}.top{position:fixed;z-index:5;top:0;width:min(560px,100%);padding:15px 18px;background:#211238ee;display:flex;justify-content:space-between;border-bottom:1px solid #51366f}.top b{color:#ffd66b}.feed{height:100vh;overflow:auto;scroll-snap-type:y mandatory}.short{min-height:100vh;scroll-snap-align:start;padding:72px 22px 32px;display:flex;flex-direction:column;justify-content:center}.tag{color:#d9a8ff;font-weight:800;margin-bottom:8px}.title{color:#ffd66b;font-size:14px;font-weight:800;margin-bottom:12px}.text{font-family:Georgia,'Times New Roman',serif;font-size:20px;line-height:1.43;white-space:pre-wrap}.box{margin-top:12px;padding:11px 13px;border-radius:14px;background:#321d50;border:1px solid #65458b}.box b{color:#ffd66b}.box div{margin-top:6px;line-height:1.4}.meaning{background:#291943}.source{color:#c9bada;font-size:13px;margin-top:12px;padding-top:9px;border-top:1px solid #51366f}.counter{color:#c9bada;font-size:12px}</style></head><body><div class="app"><div class="top"><b>RELIGIÃO • SHORTS</b><span class="counter" id="count"></span></div><main id="feed" class="feed"></main></div><script src="shorts-data.js?v=5"></script><script>const S=window.RELIGIAO_SHORTS||[];const M={1:'Na véspera da Páscoa judaica, o texto relata que Yeshu foi executado após ser acusado de feitiçaria e de levar Israel ao desvio; também afirma que houve anúncio para apresentação de defesa, mas nenhuma defesa foi encontrada.',2:'O trecho pergunta se o chamado filho de Stada teria trazido práticas de feitiçaria do Egito gravadas ou cortadas na própria carne. A resposta rejeita esse caso como prova porque o homem é tratado como insensato.',3:'O trecho discute a identidade e os nomes do personagem: filho de Stada ou filho de Pandera. O mestre Hisda explica que Stada seria o marido e Pandera o amante.',4:'O trecho discute a identidade familiar do personagem e de sua mãe, Miriam. A frase final diz, aproximadamente pelo contexto, que ela teria se desviado do marido.',5:'O mestre Beivai, citando o rabino Shimon Hasida, afirma que roubar um não judeu é proibido, mas que um objeto perdido por ele pode ser retido.',6:'O trecho procura o fundamento textual para a proibição de roubar um não judeu e distingue aquilo que foi legitimamente entregue à pessoa daquilo que não foi.',7:'O trecho interpreta a expressão “objeto perdido de teu irmão” como obrigação de devolver ao irmão, mas não como obrigação equivalente de devolver ao não judeu.',8:'O trecho esclarece que a regra discutida sobre objeto perdido também alcança o caso em que o objeto já foi efetivamente encontrado e chegou às mãos da pessoa.',9:'O rabino Pinhas, filho de Yair, afirma que, quando reter o objeto causaria profanação do nome de Deus, a retenção deixa de ser permitida.',10:'Samuel afirma de forma breve que o erro cometido pela outra parte na transação pode ser aproveitado.',11:'O texto dá como exemplo Samuel comprando de um não judeu uma vasilha de ouro pelo preço de uma de ferro e menciona a moeda antiga chamada zuz.',12:'O trecho exige que a conta com o comprador de um escravo hebreu seja feita cuidadosamente, isto é, mediante cálculo correto.',13:'O mestre José distingue dois casos: o de um não judeu em geral e o de um estrangeiro residente que possui um estatuto religioso-jurídico específico.',14:'O rabino Meir afirma que até um não judeu que estuda a parte da Lei judaica que lhe diz respeito pode receber uma comparação elevada, semelhante à de um sumo sacerdote.',15:'O contexto limita a afirmação anterior aos sete mandamentos atribuídos aos não judeus.',16:'Os sábios afirmam que é permitido negociar com um não judeu que vai a uma feira tanto durante a ida quanto durante a volta.',17:'Para um israelita que vai à feira, o trecho estabelece regra diferente: permite na ida e proíbe na volta.',18:'O mestre Ashi explica que a tradição citada se refere especificamente a um israelita apóstata, isto é, alguém que abandonou sua religião.',19:'O trecho estabelece que um objeto de idolatria pertencente a um não judeu só se torna proibido depois de ser efetivamente adorado, enquanto aplica regra imediata ao objeto de um israelita.',20:'O trecho afirma que um israelita não pode retirar o estado religioso de idolatria do objeto de um não judeu, mas o próprio não judeu pode fazê-lo em relação ao seu objeto.',21:'O rabino Shimon, filho de Menasya, sustenta que um objeto de idolatria pertencente a um israelita nunca perde esse estado por anulação.',22:'O trecho distingue bens recebidos por herança de bens mantidos em sociedade e afirma que, no segundo caso, a divisão mencionada é proibida.',23:'O trecho formula a dúvida sobre se um estrangeiro residente com estatuto religioso-jurídico específico pode retirar de um objeto seu estado de idolatria.',24:'O mestre Judá afirma conhecer determinada pessoa não judia e saber que ela não pratica idolatria.',25:'O trecho define esse estrangeiro residente como alguém que, diante de três membros reconhecidos da comunidade, assumiu o compromisso de não praticar idolatria.',26:'O trecho esclarece que o ensinamento rabínico externo à Mishná citado nesse contexto trata da obrigação de sustentar esse estrangeiro residente.',27:'A Mishná estabelece uma regra sobre quando objetos de idolatria de não judeus e de israelitas passam a ser proibidos, distinguindo os dois casos.',28:'A Mishná afirma que um não judeu pode retirar o estado de idolatria do próprio objeto e do objeto de outro não judeu, enquanto um israelita não pode fazê-lo quanto ao objeto de um não judeu.',29:'O trecho explica que danificar fisicamente partes do ídolo, como orelha, nariz ou dedo, ou esmagá-lo, é considerado ato suficiente para retirar seu estado de idolatria.',30:'O trecho afirma que atos de desprezo como cuspir, urinar, arrastar ou lançar excremento diante ou sobre o ídolo não bastam, por si, para retirar seu estado de idolatria.',31:'O trecho proíbe uma mulher israelita de atuar como parteira de uma mulher não judia porque isso é descrito como ajudar a gerar alguém para a idolatria; também proíbe que amamente o filho de uma não judia. O texto permite as situações inversas sob as condições indicadas.',32:'O trecho repete a proibição de uma israelita fazer o parto de uma não judia e acrescenta, segundo a opinião do rabino Meir, uma restrição à atuação de uma não judia como parteira de uma israelita por suspeita de derramamento de sangue.',33:'O trecho afirma, literalmente em sua regra, que não se deve retirar do poço nem empurrar para dentro dele os grupos ali mencionados: não judeus e pastores de gado miúdo.',34:'Na véspera da Páscoa judaica, o texto relata a execução de Yeshu por acusações de feitiçaria e de desviar Israel, acrescentando que foi anunciada a possibilidade de defesa e que nenhuma defesa foi encontrada.',35:'O trecho pergunta se o filho de Stada trouxe feitiçaria do Egito gravada na carne e depois discute sua identidade familiar. O mestre Hisda distingue marido e amante; a parte final associa Miriam à afirmação de que teria se desviado do marido.',36:'O trecho interpreta “objeto perdido de teu irmão” como dever de devolver ao irmão, mas não ao não judeu.',37:'O rabino Pinhas, filho de Yair, afirma que, se a retenção do objeto perdido provocar profanação do nome de Deus, não é permitido retê-lo.',38:'Samuel afirma que o erro comercial do não judeu pode ser aproveitado; o exemplo apresentado é a compra de uma vasilha de ouro pelo preço de uma de ferro, envolvendo a antiga moeda chamada zuz.'};count.textContent=S.length+' shorts';function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}feed.innerHTML=S.map(x=>`<article class="short"><div class="tag">${esc(x.category||'Texto')}</div>${x.title?`<div class="title">${esc(x.title)}</div>`:''}<div class="text">${esc(x.text)}</div>${x.translation?`<div class="box"><b>Tradução / termos em português</b><div>${esc(x.translation)}</div></div>`:''}<div class="box meaning"><b>Significado aproximado pelo contexto</b><div>${esc(M[x.id]||'O material fornecido não traz contexto suficiente para ampliar o significado com segurança.')}</div></div>${x.source?`<div class="source">Fonte: ${esc(x.source)}</div>`:''}</article>`).join('');</script></body></html>
