<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2b1748"><link rel="manifest" href="manifest.webmanifest"><title>Religião</title><style>*{box-sizing:border-box}body{margin:0;background:#10091b;color:#fff;font:15px system-ui}.app{max-width:560px;margin:auto;min-height:100vh;background:#211238}.top{position:fixed;z-index:5;top:0;width:min(560px,100%);padding:15px;background:#211238ee;display:flex;justify-content:space-between}.top b,.letter{color:#ffd66b}.feedfilter{position:fixed;z-index:4;top:48px;width:min(560px,100%);display:flex;gap:6px;padding:7px 12px;background:#211238ee}.feedfilter button{flex:1;border:1px solid #65458b;background:#321d50;color:#c9bada;padding:8px 4px;border-radius:10px;font-size:12px}.feedfilter button.on{background:#ffd66b;color:#211238;font-weight:900}.feed{height:100vh;overflow:auto;scroll-snap-type:y mandatory}.q{min-height:100vh;scroll-snap-align:start;padding:105px 18px 85px;display:flex;flex-direction:column;justify-content:center}.tag{color:#d9a8ff;font-weight:800}.topic,.small{color:#c9bada}.q h1{font-size:22px}.opt,.card,input{border-radius:14px}.opt{width:100%;border:1px solid #65458b;background:#321d50;color:#fff;padding:14px;text-align:left;margin:6px 0}.opt.ok{background:#176744;border:2px solid #5be0a4}.opt.no{background:#762d40;border:2px solid #ff8196}.panel{padding:75px 16px 90px}.card{background:#321d50;border:1px solid #65458b;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric strong{font-size:24px;display:block}.hidden{display:none!important}.primary,.secondary{width:100%;padding:13px;border-radius:14px;margin:5px 0}.primary{background:#ffd66b;border:0;font-weight:900}.secondary{background:#321d50;border:1px solid #65458b;color:#fff}input{width:100%;padding:12px;background:#1a0e2c;border:1px solid #65458b;color:#fff;margin:5px 0 10px}nav{position:fixed;z-index:6;bottom:0;width:min(560px,100%);display:flex;justify-content:space-around;background:#211238f5;border-top:1px solid #65458b;padding:8px}nav button{background:none;border:0;color:#c9bada;font-size:11px}nav button.on{color:#fff}</style></head><body><div class="app"><div class="top"><b>RELIGIÃO</b><small>Estudo</small></div><div id="feedFilter" class="feedfilter"><button id="fp" class="on" onclick="setMode('pending')">⏳ A estudar</button><button id="fr" onclick="setMode('resolved')">✅ Estudadas</button><button id="fa" onclick="setMode('all')">📚 Todas</button></div><main id="feed" class="feed"></main><section id="subjects" class="panel hidden"><h2>📚 Temas</h2><input id="find" placeholder="Buscar tema" oninput="subjects()"><div id="sl"></div></section><section id="reading" class="panel hidden"><h2>📖 Leitura</h2><div id="readingList"></div></section><section id="stats" class="panel hidden"><h2>📊 Desempenho</h2><div class="grid"><div class="card metric"><strong id="an">0</strong>respondidas</div><div class="card metric"><strong id="ac">0</strong>acertos</div><div class="card metric"><strong id="rt">0%</strong>aproveitamento</div><div class="card metric"><strong id="fv">0</strong>favoritas</div></div><div id="bs" class="card"></div></section><section id="more" class="panel hidden"><h2>☰ Mais</h2><div class="card"><h3>🎯 Treino</h3><button class="primary" onclick="filterArea=null;setMode('all');tab('feed')">Começar treino</button></div><div class="card"><h3>⭐ Favoritas</h3><p>Salve conteúdos e questões para revisar depois.</p></div><div class="card"><h3>💾 Progresso</h3><p>Os dados ficam salvos localmente neste aparelho.</p></div></section><nav><button id="nf" class="on" onclick="tab('feed')">🎬<br>Shorts</button><button id="nrd" onclick="tab('reading')">📖<br>Leitura</button><button id="nsu" onclick="tab('subjects')">📚<br>Temas</button><button id="nst" onclick="tab('stats')">📊<br>Desempenho</button><button id="nmo" onclick="tab('more')">☰<br>Mais</button></nav></div><script src="questions-data.js"></script><script src="reading-data.js"></script><script>const Q=window.RELIGIAO_QUESTIONS||[],R=window.RELIGIAO_READING||[];const AREAS=[...new Set([...Q.map(x=>x.a),...R.map(x=>x.a)])];let st=JSON.parse(localStorage.getItem('religiao-state-v1')||'{"answers":{},"fav":[]}'),mode='pending',filterArea=null;function save(){localStorage.setItem('religiao-state-v1',JSON.stringify(st));stats()}function current(){let a=Q.filter(x=>!filterArea||x.a===filterArea);if(mode==='pending')a=a.filter(x=>st.answers[x.id]===undefined);if(mode==='resolved')a=a.filter(x=>st.answers[x.id]!==undefined);return a}function render(){let a=current();feed.innerHTML=a.length?a.map(x=>`<article class="q"><div class="tag">${x.a}</div><div class="topic">${x.t||''}</div><h1>${x.q}</h1>${x.o.map((v,i)=>`<button class="opt ${st.answers[x.id]!==undefined?(i===x.c?'ok':st.answers[x.id]===i?'no':''):''}" ${st.answers[x.id]!==undefined?'disabled':''} onclick="answer('${x.id}',${i})"><span class="letter">${String.fromCharCode(65+i)}.</span> ${v}</button>`).join('')}${st.answers[x.id]!==undefined?`<div class="card"><b>${st.answers[x.id]===x.c?'✅ Correto':'❌ Incorreto'}</b><p>${x.e||''}</p></div>`:''}<button class="secondary" onclick="fav('${x.id}')">${st.fav.includes(x.id)?'★ Favorita':'☆ Salvar'}</button></article>`).join(''):'<div class="q"><h2>Banco pronto para receber os materiais de estudo.</h2><p class="small">Nenhuma questão neste filtro.</p></div>'}function answer(id,i){if(st.answers[id]!==undefined)return;st.answers[id]=i;save();render()}function fav(id){st.fav.includes(id)?st.fav=st.fav.filter(x=>x!==id):st.fav.push(id);save();render()}function setMode(m){mode=m;['fp','fr','fa'].forEach(x=>document.getElementById(x).classList.remove('on'));document.getElementById({pending:'fp',resolved:'fr',all:'fa'}[m]).classList.add('on');render()}function tab(id){['feed','subjects','reading','stats','more'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));feedFilter.classList.toggle('hidden',id!=='feed');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));({feed:nf,reading:nrd,subjects:nsu,stats:nst,more:nmo}[id]).classList.add('on');if(id==='subjects')subjects();if(id==='reading')readings();if(id==='stats')stats()}function subjects(){let q=(find.value||'').toLowerCase();sl.innerHTML=AREAS.filter(x=>x.toLowerCase().includes(q)).map(x=>`<div class="card" onclick="filterArea='${x}';setMode('all');tab('feed')"><b>${x}</b><p class="small">Abrir questões deste tema</p></div>`).join('')||'<div class="card">Os temas aparecerão aqui quando os materiais forem adicionados.</div>'}function readings(){readingList.innerHTML=R.length?R.map(x=>`<div class="card"><div class="tag">${x.a}</div><h3>${x.title}</h3><p>${x.text}</p>${x.source?`<small>Fonte: ${x.source}</small>`:''}</div>`).join(''):'<div class="card">A área de leitura está pronta para receber resumos extraídos dos materiais fornecidos.</div>'}function stats(){let ids=Object.keys(st.answers),ok=ids.filter(id=>{let q=Q.find(x=>x.id==id);return q&&st.answers[id]===q.c}).length;an.textContent=ids.length;ac.textContent=ok;rt.textContent=ids.length?Math.round(ok/ids.length*100)+'%':'0%';fv.textContent=st.fav.length;bs.innerHTML=AREAS.length?AREAS.map(a=>{let qs=Q.filter(q=>q.a===a),r=qs.filter(q=>st.answers[q.id]!==undefined),c=r.filter(q=>st.answers[q.id]===q.c).length;return `<p><b>${a}</b><br><span class="small">${r.length} respondidas • ${r.length?Math.round(c/r.length*100):0}% de acertos</span></p>`}).join(''):'Aguardando conteúdo.'}render();subjects();readings();stats();</script></body></html>
