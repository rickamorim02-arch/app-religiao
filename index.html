<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2b1748"><link rel="manifest" href="manifest.webmanifest"><title>Religião</title><style>*{box-sizing:border-box}body{margin:0;background:#10091b;color:#fff;font:16px system-ui}.app{max-width:560px;margin:auto;min-height:100vh;background:#211238}.top{position:fixed;z-index:5;top:0;width:min(560px,100%);padding:15px 18px;background:#211238ee;display:flex;justify-content:space-between;border-bottom:1px solid #51366f}.top b{color:#ffd66b}.feed{height:100vh;overflow:auto;scroll-snap-type:y mandatory;padding-bottom:62px}.short{min-height:100vh;scroll-snap-align:start;padding:72px 22px 75px;display:flex;flex-direction:column;justify-content:center}.number{font-size:13px;font-weight:900;color:#ffd66b;margin-bottom:5px}.tag{color:#d9a8ff;font-weight:800;margin-bottom:8px}.title{color:#ffd66b;font-size:14px;font-weight:800;margin-bottom:12px}.text{font-family:Georgia,'Times New Roman',serif;font-size:20px;line-height:1.43;white-space:pre-wrap}.box{margin-top:12px;padding:11px 13px;border-radius:14px;background:#321d50;border:1px solid #65458b}.box b{color:#ffd66b}.box div{margin-top:6px;line-height:1.4}.meaning{background:#291943}.source{color:#c9bada;font-size:13px;margin-top:12px;padding-top:9px;border-top:1px solid #51366f}.counter{color:#c9bada;font-size:12px}.notes{padding:78px 18px 90px;min-height:100vh}.notes h2{color:#ffd66b}.notes textarea{width:100%;min-height:55vh;background:#170d28;color:#fff;border:1px solid #65458b;border-radius:14px;padding:15px;font:16px/1.5 system-ui;resize:vertical}.notes button{width:100%;padding:13px;margin-top:10px;border-radius:13px;border:0;font-weight:900}.print{background:#ffd66b;color:#211238}.clear{background:#321d50;color:#fff;border:1px solid #65458b!important}.saved{color:#c9bada;font-size:12px;margin-top:8px}.hidden{display:none!important}nav{position:fixed;z-index:8;bottom:0;width:min(560px,100%);height:62px;background:#211238f5;border-top:1px solid #65458b;display:flex}nav button{flex:1;background:none;border:0;color:#c9bada;font-weight:700}nav button.on{color:#ffd66b}@media print{body,.app{background:#fff;color:#000}.top,nav,#feed,.notes button,.saved{display:none!important}.notes{display:block!important;padding:0}.notes h2{color:#000}.notes textarea{border:0;color:#000;background:#fff;min-height:auto;width:100%;height:auto;overflow:visible;font-family:Georgia,'Times New Roman',serif;font-size:12pt;white-space:pre-wrap}}</style></head><body><div class="app"><div class="top"><b id="headTitle">RELIGIÃO • SHORTS</b><span class="counter" id="count"></span></div><main id="feed" class="feed"></main><section id="notes" class="notes hidden"><h2>📝 Anotações</h2><p>Escreva suas anotações abaixo. Elas ficam salvas neste aparelho.</p><textarea id="noteText" placeholder="Digite suas anotações..."></textarea><div id="saved" class="saved">Salvo automaticamente.</div><button class="print" onclick="window.print()">🖨️ Imprimir anotações</button><button class="clear" onclick="clearNotes()">Limpar anotações</button></section><nav><button id="tabShorts" class="on" onclick="tab('shorts')">🎬<br>Shorts</button><button id="tabNotes" onclick="tab('notes')">📝<br>Anotações</button></nav></div><script src="shorts-data.js?v=6"></script><script src="corpus-200.js?v=2"></script><script src="corpus-refs.js?v=2"></script><script>const S=[...(window.RELIGIAO_SHORTS||[]),...(window.RELIGIAO_CORPUS_200||[])];count.textContent=S.length+' shorts';function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function significado(x){if(x.meaning)return x.meaning;return 'Em português direto e aproximadamente pelo contexto: '+String(x.text||'').replace(/\s*Trecho\/conteúdo conferido na pesquisa\.?/g,'').trim();}feed.innerHTML=S.map((x,i)=>`<article class="short"><div class="number">SHORT ${i+1} DE ${S.length}</div><div class="tag">${esc(x.category||'Texto')}</div>${x.title?`<div class="title">${esc(x.title)}</div>`:''}<div class="text">${esc(x.text)}</div>${x.translation?`<div class="box"><b>Tradução / termos em português</b><div>${esc(x.translation)}</div></div>`:''}<div class="box meaning"><b>Significado aproximado pelo contexto</b><div>${esc(significado(x))}</div></div>${x.source?`<div class="source">Fonte: ${esc(x.source)}</div>`:''}</article>`).join('');const noteText=document.getElementById('noteText');noteText.value=localStorage.getItem('religiao-notas')||'';noteText.addEventListener('input',()=>{localStorage.setItem('religiao-notas',noteText.value);saved.textContent='Salvo automaticamente • '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});function tab(t){let isNotes=t==='notes';feed.classList.toggle('hidden',isNotes);notes.classList.toggle('hidden',!isNotes);tabShorts.classList.toggle('on',!isNotes);tabNotes.classList.toggle('on',isNotes);headTitle.textContent=isNotes?'RELIGIÃO • ANOTAÇÕES':'RELIGIÃO • SHORTS';count.textContent=isNotes?'':S.length+' shorts'}function clearNotes(){if(confirm('Apagar todas as anotações deste aparelho?')){noteText.value='';localStorage.removeItem('religiao-notas');saved.textContent='Anotações apagadas.'}}</script></body></html>
