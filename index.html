<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2b1748"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><link rel="manifest" href="manifest.webmanifest"><title>Religião</title><style>*{box-sizing:border-box}body{margin:0;background:#10091b;color:#fff;font:16px system-ui}.app{max-width:560px;margin:auto;min-height:100vh;background:#211238}.top{position:fixed;z-index:5;top:0;width:min(560px,100%);padding:15px 18px;background:#211238ee;display:flex;justify-content:space-between;border-bottom:1px solid #51366f}.top b,.number,.title,.box b,.notes h2{color:#ffd66b}.feed{height:100vh;overflow:auto;scroll-snap-type:y mandatory;padding-bottom:62px}.short{min-height:100vh;scroll-snap-align:start;padding:72px 22px 85px;display:flex;flex-direction:column;justify-content:center}.number{font-size:13px;font-weight:900;margin-bottom:5px}.tag{color:#d9a8ff;font-weight:800;margin-bottom:8px}.title{font-size:14px;font-weight:800;margin-bottom:12px}.text{font-family:Georgia,'Times New Roman',serif;font-size:20px;line-height:1.43;white-space:pre-wrap}.box{margin-top:12px;padding:11px 13px;border-radius:14px;background:#321d50;border:1px solid #65458b}.box div{margin-top:6px;line-height:1.4}.meaning{background:#291943}.shortnote{margin-top:14px;padding-top:12px;border-top:1px solid #51366f}.shortnote label{display:block;color:#ffd66b;font-weight:800;margin-bottom:7px}.shortnote textarea{width:100%;min-height:90px;background:#170d28;color:#fff;border:1px solid #65458b;border-radius:12px;padding:11px;font:15px/1.4 system-ui;resize:vertical}.noteactions{display:flex;gap:8px;margin-top:8px}.saveNote,.clearNote,.newNote{padding:11px 13px;border-radius:11px;font-weight:900}.saveNote,.newNote{flex:1;background:#ffd66b;color:#211238;border:0}.clearNote{background:#321d50;color:#fff;border:1px solid #65458b}.noteStatus{display:block;color:#c9bada;font-size:12px;margin-top:7px;min-height:17px}.source{color:#c9bada;font-size:13px;margin-top:12px;padding-top:9px;border-top:1px solid #51366f}.counter,.saved{color:#c9bada;font-size:12px}.notes{padding:78px 18px 90px;min-height:100vh}.noteList{display:flex;flex-direction:column;gap:12px}.noteCard{background:#291943;border:1px solid #65458b;border-radius:14px;padding:14px}.noteCard b{color:#ffd66b}.noteCard .ref{color:#c9bada;font-size:12px;margin:5px 0 10px}.noteCard .body{white-space:pre-wrap;line-height:1.45}.noteCard button{margin-top:10px;padding:8px 10px;border-radius:9px;background:#321d50;color:#fff;border:1px solid #65458b}.emptyNotes{color:#c9bada;padding:25px 0;text-align:center}.print{width:100%;padding:13px;margin-top:16px;border-radius:13px;border:0;font-weight:900;background:#ffd66b;color:#211238}.hidden{display:none!important}nav{position:fixed;z-index:8;bottom:0;width:min(560px,100%);height:62px;background:#211238f5;border-top:1px solid #65458b;display:flex}nav button{flex:1;background:none;border:0;color:#c9bada;font-weight:700}nav button.on{color:#ffd66b}@media print{body,.app{background:#fff;color:#000}.top,nav,#feed,.noteCard button{display:none!important}.notes{display:block!important;padding:0}.notes h2,.noteCard b{color:#000}.noteCard{background:#fff;border:1px solid #aaa;break-inside:avoid}.noteCard .ref{color:#555}.print{display:none}}</style></head><body><div class="app"><div class="top"><b id="headTitle">RELIGIÃO • SHORTS</b><span class="counter" id="count"></span></div><main id="feed" class="feed"></main><section id="notes" class="notes hidden"><h2>📝 Anotações salvas</h2><p>Suas anotações dos Shorts aparecem aqui em lista.</p><div id="noteList" class="noteList"></div><button class="print" onclick="window.print()">🖨️ Imprimir anotações</button></section><nav><button id="tabShorts" class="on" onclick="tab('shorts')">🎬<br>Shorts</button><button id="tabNotes" onclick="tab('notes')">📝<br>Anotações</button></nav></div><script src="shorts-data.js?v=20261001d"></script><script src="corpus-200.js?v=20261001d"></script><script src="corpus-refs.js?v=20261001d"></script><script>let base=window.RELIGIAO_SHORTS||[];let extra=window.RELIGIAO_CORPUS_200||[];if(extra.length<200&&typeof RELIGIAO_CORPUS_REFS!=='undefined'){extra=RELIGIAO_CORPUS_REFS.slice(0,200).map((r,i)=>({id:39+i,category:'Talmude — corpus de 200',title:(i+1)+'. '+r,text:'Referência textual do corpus: '+r+'.',translation:trRef(r)+' Locus = lugar/passagem de referência textual.',meaning:'Em português direto e aproximadamente pelo contexto: esta unidade registra '+r+' como passagem para pesquisa no corpus.',source:r}))}const S=[...base,...extra];const count=document.getElementById('count'),feed=document.getElementById('feed'),noteList=document.getElementById('noteList');count.textContent=S.length+' shorts';function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function significado(x){return x.meaning||('Em português direto e aproximadamente pelo contexto: '+String(x.text||''))}function noteKey(i){return'religiao-short-nota-'+i}function editor(i){return `<div class="shortnote" id="editor${i}"><label>📝 Minha anotação deste Short</label><textarea id="shortNote${i}" placeholder="Escreva sua anotação sobre este Short..."></textarea><div class="noteactions"><button class="saveNote" onclick="saveShortNote(${i})">💾 Salvar anotação</button></div><span class="noteStatus" id="status${i}"></span></div>`}function savedButton(i){return `<div class="shortnote" id="editor${i}"><button class="newNote" onclick="editShortNote(${i})">📝 Ver / editar anotação salva</button></div>`}function renderFeed(){feed.innerHTML=S.map((x,i)=>`<article class="short"><div class="number">SHORT ${i+1} DE ${S.length}</div><div class="tag">${esc(x.category||'Texto')}</div>${x.title?`<div class="title">${esc(x.title)}</div>`:''}<div class="text">${esc(x.text)}</div>${x.translation?`<div class="box"><b>Tradução / termos em português</b><div>${esc(x.translation)}</div></div>`:''}<div class="box meaning"><b>Significado aproximado pelo contexto</b><div>${esc(significado(x))}</div></div>${x.source?`<div class="source">Fonte: ${esc(x.source)}</div>`:''}${localStorage.getItem(noteKey(i))?savedButton(i):editor(i)}</article>`).join('')}function saveShortNote(i){let t=document.getElementById('shortNote'+i),v=t?t.value.trim():'';if(!v){document.getElementById('status'+i).textContent='Escreva uma anotação antes de salvar.';return}localStorage.setItem(noteKey(i),v);document.getElementById('editor'+i).outerHTML=savedButton(i);renderNoteList()}function editShortNote(i){let holder=document.getElementById('editor'+i);holder.outerHTML=editor(i);let t=document.getElementById('shortNote'+i);t.value=localStorage.getItem(noteKey(i))||'';t.focus()}function deleteNote(i){if(confirm('Apagar esta anotação?')){localStorage.removeItem(noteKey(i));renderNoteList();let holder=document.getElementById('editor'+i);if(holder)holder.outerHTML=editor(i)}}function renderNoteList(){let rows=[];S.forEach((x,i)=>{let v=localStorage.getItem(noteKey(i));if(v)rows.push(`<div class="noteCard"><b>Short ${i+1}</b><div class="ref">${esc(x.title||x.source||x.category||'Texto')}</div><div class="body">${esc(v)}</div><button onclick="deleteNote(${i})">Excluir anotação</button></div>`)});noteList.innerHTML=rows.length?rows.join(''):'<div class="emptyNotes">Nenhuma anotação salva ainda.</div>'}function tab(t){let n=t==='notes';feed.classList.toggle('hidden',n);notes.classList.toggle('hidden',!n);tabShorts.classList.toggle('on',!n);tabNotes.classList.toggle('on',n);headTitle.textContent=n?'RELIGIÃO • ANOTAÇÕES':'RELIGIÃO • SHORTS';count.textContent=n?'':S.length+' shorts';if(n)renderNoteList()}renderFeed();renderNoteList();</script></body></html>
